name: Users Service CI/CD

on:
  push:
    paths:
      - "tasks-service/**"

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/tasks-service:latest tasks-service

      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/tasks-service:latest
