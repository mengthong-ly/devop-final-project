name: Auth Service CI/CD

on:
  push:
    paths:
      - "auth-service/**"

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/auth-service:latest auth-service/

      - name: Push Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/auth-service:latest

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~

            echo "Stopping running containers..."
            docker compose down

            echo "Cleaning Docker (free-tier safe)..."
            docker container prune -f
            docker image prune -af
            docker volume prune -f
            docker network prune -f

            echo "Pulling latest image..."
            docker compose pull auth-service

            echo "Starting service..."
            docker compose up -d auth-service
