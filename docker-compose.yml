version: "3.9"

services:
  # ===============================
  # USERS SERVICE (PHP-FPM)
  # ===============================
  users-service:
    build: ./users-service
    container_name: users-php
    restart: always
    expose:
      - "9000"
    environment:
      APP_ENV: production
      APP_KEY: base64:R1cdV7Cql0hOPb6ZWFJMA8zhe5XdYAFLfCoXo+AkJ7s=
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: users-db
      DB_PORT: 5432
      DB_DATABASE: users_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      - users-db

  users-nginx:
    image: nginx:stable
    container_name: users-nginx
    restart: always
    ports:
      - "8001:80"
    volumes:
      - ./users-service:/var/www
      - ./users-service/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - users-service

  users-db:
    image: postgres:15
    container_name: users-db
    restart: always
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - users_data:/var/lib/postgresql/data

  # ===============================
  # TASKS SERVICE (PHP-FPM)
  # ===============================
  tasks-service:
    build: ./tasks-service
    container_name: tasks-php
    restart: always
    expose:
      - "9000"
    environment:
      APP_ENV: production
      APP_KEY: base64:R1cdV7Cql0hOPb6ZWFJMA8zhe5XdYAFLfCoXo+AkJ7s=
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: tasks-db
      DB_PORT: 5432
      DB_DATABASE: tasks_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      - tasks-db

  tasks-nginx:
    image: nginx:stable
    container_name: tasks-nginx
    restart: always
    ports:
      - "8002:80"
    volumes:
      - ./tasks-service:/var/www
      - ./tasks-service/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - tasks-service

  tasks-db:
    image: postgres:15
    container_name: tasks-db
    restart: always
    environment:
      POSTGRES_DB: tasks_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - tasks_data:/var/lib/postgresql/data

  # ===============================
  # ASSIGNMENTS SERVICE (PHP-FPM)
  # ===============================
  assignments-service:
    build: ./assignments-service
    container_name: assignments-php
    restart: always
    expose:
      - "9000"
    environment:
      APP_ENV: production
      APP_KEY: base64:R1cdV7Cql0hOPb6ZWFJMA8zhe5XdYAFLfCoXo+AkJ7s=
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: assignments-db
      DB_PORT: 5432
      DB_DATABASE: assignments_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      - assignments-db

  assignments-nginx:
    image: nginx:stable
    container_name: assignments-nginx
    restart: always
    ports:
      - "8003:80"
    volumes:
      - ./assignments-service:/var/www
      - ./assignments-service/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - assignments-service

  assignments-db:
    image: postgres:15
    container_name: assignments-db
    restart: always
    environment:
      POSTGRES_DB: assignments_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - assignments_data:/var/lib/postgresql/data

# ===============================
# VOLUMES
# ===============================

volumes:
  users_data:
  tasks_data:
  assignments_data:
